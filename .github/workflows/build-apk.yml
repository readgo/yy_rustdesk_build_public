name: Build Android APK

on:
  push:
    tags:
      - 'release-apk-*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    name: Android APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-24.04

    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm libclang-17-dev gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Link Android SDK for build_light.sh
        run: |
          mkdir -p "$HOME/.yy_rustdesk_env"
          ln -sf /usr/local/lib/android/sdk "$HOME/.yy_rustdesk_env/android-sdk" 2>/dev/null || true

      - name: Pre-cache Gradle distribution
        run: |
          PROP="flutter/android/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VER=$(grep -oP 'gradle-\K[^/]+(?=-bin.zip)' "$PROP" 2>/dev/null || echo "7.6.4")
          DIST_URL=$(grep -oP 'distributionUrl=\K.*' "$PROP" 2>/dev/null || echo "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip")
          echo "Gradle: $GRADLE_VER"
          echo "URL: $DIST_URL"

          # 用 curl 下载
          curl -sL -o /tmp/gradle-bin.zip "$DIST_URL" 2>&1 || \
          curl -sL -o /tmp/gradle-bin.zip "${DIST_URL/https/http}" 2>&1

          if [ -f /tmp/gradle-bin.zip ] && [ -s /tmp/gradle-bin.zip ]; then
            echo "下载成功 ($(stat --format=%s /tmp/gradle-bin.zip) bytes)"
            unzip -qo /tmp/gradle-bin.zip -d /tmp/gradle-extracted
            # 计算 wrapper 缓存哈希（直接匹配原始 distributionUrl）
            HASH_INPUT="distributionBase=GRADLE_USER_HOME&distributionPath=wrapper/dists&distributionUrl=${DIST_URL}&json=1"
            WRAPPER_HASH=$(echo -n "$HASH_INPUT" | sha256sum | cut -d' ' -f1)
            CACHE_DIR="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VER}-bin/$WRAPPER_HASH"
            mkdir -p "$CACHE_DIR"
            cp -r "/tmp/gradle-extracted/gradle-${GRADLE_VER}"/* "$CACHE_DIR/"
            echo "Gradle 缓存: $CACHE_DIR ($(ls "$CACHE_DIR" | wc -l) files)"
          else
            echo "下载失败，使用系统 gradle"
            if command -v gradle &>/dev/null; then
              cat > flutter/android/gradlew << 'S'
          #!/bin/bash
          exec "$(which gradle)" "$@"
          S
              chmod +x flutter/android/gradlew
              echo "gradlew 已替换为系统 gradle"
            fi
          fi

      - name: Setup Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Setup + Build APK
        env:
          YY_SERVER_URL: ${{ secrets.YY_SERVER_URL }}
          YY_KEY: ${{ secrets.YY_KEY }}
          YY_TERMINAL_URL: ${{ secrets.YY_TERMINAL_URL }}
          YY_SECRET_KEY: ${{ secrets.YY_SECRET_KEY }}
        run: |
          set -e -o pipefail
          exec 5>&1  # 保存原始 stdout
          exec > >(tee /tmp/build-output.log) 2>&1
          
          # 预装 NDK 和 vcpkg 依赖（与 build_light.sh 共享路径）
          export BUILD_ENV_DIR="$HOME/.yy_rustdesk_env"
          mkdir -p "$BUILD_ENV_DIR"
          export NDK_DIR="$BUILD_ENV_DIR/android-ndk-r23b"
          export ANDROID_NDK_HOME="$NDK_DIR"

          if [ ! -d "$NDK_DIR" ]; then
            echo "=== 下载 NDK r23b ==="
            curl -# -L -o /tmp/ndk-r23b.zip \
              "https://dl.google.com/android/repository/android-ndk-r23b-linux.zip"
            unzip -q /tmp/ndk-r23b.zip -d "$BUILD_ENV_DIR"
            rm -f /tmp/ndk-r23b.zip
            echo "NDK 就绪"
          fi

          export VCPKG_DIR="$BUILD_ENV_DIR/vcpkg"
          if [ ! -x "$VCPKG_DIR/vcpkg" ]; then
            echo "=== 下载 vcpkg ==="
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi

          export VCPKG_INSTALLED_DIR="$BUILD_ENV_DIR/vcpkg_installed"
          export VCPKG_ROOT="$VCPKG_DIR"

          # 装 arm64-android 依赖（--classic 逐个指定，避免 ffmpeg 等复杂包失败拖累全局）
          cd "$GITHUB_WORKSPACE"
          if [ ! -d "$VCPKG_INSTALLED_DIR/arm64-android/include/opus" ]; then
            echo "=== 安装 arm64-android 依赖 ==="
            "$VCPKG_DIR/vcpkg" install --classic \
              "opus:arm64-android" \
              "libvpx:arm64-android" \
              "libyuv:arm64-android" \
              "aom:arm64-android" \
              "oboe:arm64-android" \
              "cpu-features:arm64-android" \
              --x-install-root="$VCPKG_INSTALLED_DIR"
          fi
          if [ ! -d "$VCPKG_INSTALLED_DIR/arm-neon-android/include/opus" ]; then
            echo "=== 安装 arm-neon-android 依赖 ==="
            "$VCPKG_DIR/vcpkg" install --classic \
              "opus:arm-neon-android" \
              "libvpx:arm-neon-android" \
              "libyuv:arm-neon-android" \
              "aom:arm-neon-android" \
              "oboe:arm-neon-android" \
              "cpu-features:arm-neon-android" \
              --x-install-root="$VCPKG_INSTALLED_DIR"
          fi

          # 验证
          echo "=== arm64 headers ==="
          find "$VCPKG_INSTALLED_DIR/arm64-android/include" -name "*.h" 2>/dev/null | wc -l
          echo "=== arm64 libs ==="
          ls "$VCPKG_INSTALLED_DIR/arm64-android/lib/" 2>/dev/null | wc -l
          
          # 用空桩替换 oboe 库（避免与 oboe-sys crate 编译的版本重复符号）
          for triplet in arm64-android arm-neon-android; do
            OBOE_DIR="$VCPKG_INSTALLED_DIR/$triplet/lib"
            if [ -f "$OBOE_DIR/liboboe.a" ]; then
              echo "替换 $triplet/liboboe.a 为空桩"
              rm -f "$OBOE_DIR/liboboe.a" "$OBOE_DIR/liboboe.so"
              # 创建空的目标文件
              echo '' | "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" -c -x c - -o /tmp/oboe_stub.o 2>/dev/null || touch /tmp/oboe_stub.o
              "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" crs "$OBOE_DIR/liboboe.a" /tmp/oboe_stub.o 2>/dev/null || true
              rm -f /tmp/oboe_stub.o
            fi
          done

          # 跑 build_light.sh
          echo "=== 开始 build_light.sh ==="
          bash flutter/build_light.sh

          # APK 重命名（放在同一个步骤里，失败也能被 tee 捕获）
          echo "=== 查找 APK ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null
          APK_SRC=$(find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: no APK found after build"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          APK_NAME="YYDesk-${VERSION}.apk"
          cp "$APK_SRC" "$GITHUB_WORKSPACE/dist/$APK_NAME"
          echo "APK: dist/$APK_NAME"
          ls -lh "$GITHUB_WORKSPACE/dist/$APK_NAME"
          echo "YY_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload diagnostic (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/diag
          echo "=== Build output (last 150 lines) ===" > /tmp/diag/report.txt
          tail -150 /tmp/build-output.log 2>/dev/null >> /tmp/diag/report.txt
          echo "" >> /tmp/diag/report.txt
          echo "=== Vcpkg arm64-android ===" >> /tmp/diag/report.txt
          find /home/runner/.yy_rustdesk_env/vcpkg_installed/arm64-android/include -type f -name "*.h" 2>/dev/null | sort >> /tmp/diag/report.txt
          ls -la /home/runner/.yy_rustdesk_env/vcpkg_installed/arm64-android/lib/ 2>/dev/null >> /tmp/diag/report.txt

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ github.run_id }}
          path: /tmp/diag/
          retention-days: 3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${{ github.ref_name }}"
          VERSION="${{ env.YY_VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          fi
          echo "Tag: $TAG, Version: $VERSION"
          echo "--- dist directory ---"
          ls -la "$GITHUB_WORKSPACE/dist/" 2>/dev/null || echo "dist/ not found"
          echo "--- APK files ---"
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>/dev/null
          printf 'YYDesk v%s Android APK\n\n### 安装\n下载 APK 后，在 Android 设备上安装即可。\n首次安装需在系统设置中允许「未知来源应用」。\n\n### 架构\n- arm64-v8a (64-bit)\n- armeabi-v7a (32-bit)\n' "$VERSION" > /tmp/release-notes.md
          echo "=== 开始创建 Release ==="
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/dist/"*.apk \
            --title "YYDesk v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes 2>&1 | tee /tmp/gh-release.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo "创建失败 (exit=$exit_code)，尝试更新已有 Release..."
            cat /tmp/gh-release.log
            gh release upload "$TAG" "$GITHUB_WORKSPACE/dist/"*.apk --clobber 2>&1 || echo "upload 失败"
            gh release edit "$TAG" --notes-file /tmp/release-notes.md 2>&1 || echo "edit 失败"
          fi
