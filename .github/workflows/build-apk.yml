name: Build Android APK

on:
  push:
    tags:
      - 'release-apk-*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    name: Android APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-24.04

    steps:
      - name: Clone source
        run: |
          git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
            "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" .

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nasm libclang-17-dev

      - name: Setup vcpkg + NDK + deps
        run: |
          set -e
          BUILD_ENV_DIR="$HOME/.yy_rustdesk_env"
          mkdir -p "$BUILD_ENV_DIR"

          # NDK
          NDK_DIR="$BUILD_ENV_DIR/android-ndk-r23b"
          if [ ! -d "$NDK_DIR" ]; then
            echo "下载 NDK r23b..."
            curl -# -L -o /tmp/ndk-r23b.zip \
              "https://dl.google.com/android/repository/android-ndk-r23b-linux.zip"
            unzip -q /tmp/ndk-r23b.zip -d "$BUILD_ENV_DIR"
            rm -f /tmp/ndk-r23b.zip
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

          # vcpkg
          VCPKG_DIR="$BUILD_ENV_DIR/vcpkg"
          if [ ! -x "$VCPKG_DIR/vcpkg" ]; then
            echo "下载 vcpkg..."
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          export VCPKG_ROOT="$VCPKG_DIR"
          echo "VCPKG_ROOT=$VCPKG_DIR" >> $GITHUB_ENV

          # vcpkg_installed 缓存目录（与 build_light.sh 一致）
          VCPKG_INSTALLED_DIR="$BUILD_ENV_DIR/vcpkg_installed"
          export VCPKG_INSTALLED_ROOT="$VCPKG_INSTALLED_DIR"
          echo "VCPKG_INSTALLED_ROOT=$VCPKG_INSTALLED_DIR" >> $GITHUB_ENV

          # vcpkg install 需要从仓库根目录运行（vcpkg.json manifest 在根目录）
          cd "$GITHUB_WORKSPACE"

          # 安装 arm64-android 依赖（首次编译较慢）
          if [ ! -d "$VCPKG_INSTALLED_DIR/arm64-android/include/opus" ]; then
            echo "安装 arm64-android 依赖..."
            # --classic 绕过 manifest 模式，直接指定包名
            "$VCPKG_DIR/vcpkg" install --classic \
              "opus:arm64-android" \
              "libvpx:arm64-android" \
              "libyuv:arm64-android" \
              "aom:arm64-android" \
              --x-install-root="$VCPKG_INSTALLED_DIR"
            echo "arm64-android 依赖安装完成"
          else
            echo "arm64-android 依赖已安装"
          fi

          # 安装 arm-neon-android 依赖
          if [ ! -d "$VCPKG_INSTALLED_DIR/arm-neon-android/include/opus" ]; then
            echo "安装 arm-neon-android 依赖..."
            "$VCPKG_DIR/vcpkg" install --classic \
              "opus:arm-neon-android" \
              "libvpx:arm-neon-android" \
              "libyuv:arm-neon-android" \
              "aom:arm-neon-android" \
              --x-install-root="$VCPKG_INSTALLED_DIR"
            echo "arm-neon-android 依赖安装完成"
          else
            echo "arm-neon-android 依赖已安装"
          fi

          # 创建 build_light.sh 期望的 symlink
          mkdir -p "$VCPKG_DIR/installed"
          ln -sf "$VCPKG_INSTALLED_DIR/arm64-android" "$VCPKG_DIR/installed/arm64-android" 2>/dev/null || true
          ln -sf "$VCPKG_INSTALLED_DIR/arm-neon-android" "$VCPKG_DIR/installed/arm-android" 2>/dev/null || true

          echo "=== 验证 arm64-android ==="
          echo "--- include 目录结构 ---"
          find "$VCPKG_INSTALLED_DIR/arm64-android/include" -type d 2>/dev/null | sort || echo "(空)"
          echo "--- opus 相关文件 ---"
          find "$VCPKG_INSTALLED_DIR/arm64-android" -name "*opus*" 2>/dev/null | sort || echo "(无)"
          echo "--- lib 目录 ---"
          ls "$VCPKG_INSTALLED_DIR/arm64-android/lib/" 2>/dev/null || echo "(空)"
          echo "--- 通过 symlink 验证（magnum-opus 实际使用的路径）---"
          ls -la "$VCPKG_DIR/installed/arm64-android/include/opus/" 2>/dev/null || echo "  symlink 路径不可达"
          # 只在关键文件缺失时退出，让后续 build 报更具体的错误
          if [ ! -f "$VCPKG_INSTALLED_DIR/arm64-android/lib/libopus.a" ]; then
            echo "WARNING: libopus.a 缺失，但继续编译让 Rust 报具体错误"
          fi

      - name: Build APK (via build_light.sh)
        env:
          YY_SERVER_URL: ${{ secrets.YY_SERVER_URL }}
          YY_KEY: ${{ secrets.YY_KEY }}
          YY_TERMINAL_URL: ${{ secrets.YY_TERMINAL_URL }}
          YY_SECRET_KEY: ${{ secrets.YY_SECRET_KEY }}
        run: |
          bash flutter/build_light.sh 2>&1 | tee /tmp/build-output.log
          exit ${PIPESTATUS[0]}

      - name: Extract version
        run: |
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          echo "YY_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          OUTPUT_DIR="flutter/build/app/outputs/flutter-apk"
          APK_SRC=$(ls "$OUTPUT_DIR"/app-*.apk 2>/dev/null | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          mkdir -p dist
          APK_NAME="YYDesk-${{ env.YY_VERSION }}.apk"
          cp "$APK_SRC" "dist/$APK_NAME"
          echo "APK: dist/$APK_NAME"
          ls -lh "dist/$APK_NAME"

      - name: Save diagnostic logs
        if: failure()
        run: |
          # 收集诊断信息
          mkdir -p /tmp/diagnostic
          {
            echo "# CI Diagnostic - ${{ github.ref_name }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## Build output (last 100 lines)"
            echo '```'
            tail -100 /tmp/build-output.log 2>/dev/null || echo "(build log not found)"
            echo '```'
            echo ""
            echo "## Vcpkg arm64-android include tree"
            echo '```'
            find /home/runner/.yy_rustdesk_env/vcpkg_installed/arm64-android/include -type f -name "*.h" 2>/dev/null | sort || echo "(empty)"
            echo '```'
            echo ""
            echo "## Vcpkg arm64-android lib directory"
            echo '```'
            ls -la /home/runner/.yy_rustdesk_env/vcpkg_installed/arm64-android/lib/ 2>/dev/null || echo "(empty)"
            echo '```'
            echo ""
            echo "## Symlink check"
            echo '```'
            ls -la /home/runner/.yy_rustdesk_env/vcpkg/installed/arm64-android/include/ 2>/dev/null || echo "symlink broken"
            echo '```'
          } > /tmp/diagnostic/report.md

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ github.run_id }}
          path: /tmp/diagnostic/
          retention-days: 3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          printf 'YYDesk v%s Android APK\n\n### 安装\n下载 APK 后，在 Android 设备上安装即可。\n首次安装需在系统设置中允许「未知来源应用」。\n\n### 架构\n- arm64-v8a (64-bit)\n- armeabi-v7a (32-bit)\n' "${{ env.YY_VERSION }}" > /tmp/release-notes.md
          gh release create "$TAG" \
            dist/*.apk \
            --title "YYDesk v${{ env.YY_VERSION }}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes
