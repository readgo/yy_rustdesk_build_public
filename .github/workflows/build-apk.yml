name: Build Android APK

on:
  push:
    tags:
      - 'release-apk-*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    name: Android APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-24.04

    steps:
      - name: Clone source
        run: |
          git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
            "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" .

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm libclang-dev

      - name: Build APK (via build_light.sh)
        env:
          YY_SERVER_URL: ${{ secrets.YY_SERVER_URL }}
          YY_KEY: ${{ secrets.YY_KEY }}
          YY_TERMINAL_URL: ${{ secrets.YY_TERMINAL_URL }}
          YY_SECRET_KEY: ${{ secrets.YY_SECRET_KEY }}
        run: |
          bash flutter/build_light.sh

      - name: Extract version
        run: |
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          echo "YY_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          OUTPUT_DIR="flutter/build/app/outputs/flutter-apk"
          APK_SRC=$(ls "$OUTPUT_DIR"/app-*.apk 2>/dev/null | head -1)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi
          mkdir -p dist
          APK_NAME="YYDesk-${{ env.YY_VERSION }}.apk"
          cp "$APK_SRC" "dist/$APK_NAME"
          echo "APK: dist/$APK_NAME"
          ls -lh "dist/$APK_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          printf 'YYDesk v%s Android APK\n\n### 安装\n下载 APK 后，在 Android 设备上安装即可。\n首次安装需在系统设置中允许「未知来源应用」。\n\n### 架构\n- arm64-v8a (64-bit)\n- armeabi-v7a (32-bit)\n' "${{ env.YY_VERSION }}" > /tmp/release-notes.md
          gh release create "$TAG" \
            dist/*.apk \
            --title "YYDesk v${{ env.YY_VERSION }}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes
