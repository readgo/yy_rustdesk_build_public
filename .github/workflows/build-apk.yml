name: Build Android APK

on:
  push:
    tags:
      - 'release-apk-*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    name: Android APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-24.04

    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done

      # 版本自增已挪到 job 末尾（编译成功后才 bump）。
      # 原来的做法是 clone 完立刻 bump 并推回源码仓，导致每一轮**失败**的构建
      # 也会把远端版本号 +1：2026-10-28 的 run #124/#125/#126/#127 全挂，
      # 版本号却从 2.0.37 空涨到 2.0.41，Release 里一堆号没有对应产物。
      # 现在产物用源码里的当前版本，编译成功后再 +1 留给下一轮。

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm libclang-17-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # ★ 2026-09-15 起 Google 从 SDK 仓库下线了废弃的 tools 包
        #   （repository2-3.xml 不再列出，上游 issue: android-actions/setup-android#537）。
        #   action 默认 packages 为 "tools platform-tools" → sdkmanager 找不到 tools
        #   直接 exit 1。显式只装 platform-tools 规避；build-tools/platform 由
        #   runner 预装 SDK 提供。
        with:
          packages: platform-tools

      - name: Link Android SDK for build_light.sh
        run: |
          mkdir -p "$HOME/.yy_rustdesk_env"
          ln -sf /usr/local/lib/android/sdk "$HOME/.yy_rustdesk_env/android-sdk" 2>/dev/null || true

      - name: Pre-cache Gradle distribution + keystore
        run: |
          GRADLE_VER="7.6.4"
          GH_RELEASE="http://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          echo "下载 Gradle $GRADLE_VER (HTTP) ..."
          curl -sL --connect-timeout 30 --max-time 300 -o /tmp/gradle-bin.zip "$GH_RELEASE" &
          wait $!
          if [ -f /tmp/gradle-bin.zip ] && [ -s /tmp/gradle-bin.zip ]; then
            SIZE=$(stat --format=%s /tmp/gradle-bin.zip 2>/dev/null || echo 0)
            echo "Gradle 下载: $SIZE bytes"
            if [ "$SIZE" -gt 100000000 ]; then
              sudo unzip -qo /tmp/gradle-bin.zip -d /opt/
              echo '#!/bin/bash' > flutter/android/gradlew
              echo "exec /opt/gradle-${GRADLE_VER}/bin/gradle" '"$@"' >> flutter/android/gradlew
              chmod +x flutter/android/gradlew
            fi
          fi

      - name: Cache Android NDK r23b
        uses: actions/cache@v4
        with:
          path: ${{ runner.home }}/.yy_rustdesk_env/android-ndk-r23b
          # r23b 内容不变（source.properties = 23.1.7779620），用固定 key。
          # 解压后约 2.3GB，未命中时每轮都要从 dl.google.com 重下 ~1GB zip，
          # 跨境网络一抖就整轮失败（run #125：curl (92) HTTP/2 stream not closed cleanly）。
          # key 末尾的 -v1 是可手动升级的盐：万一缓存被写坏，改成 -v2 即整批失效。
          key: android-ndk-r23b-linux-v1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.home }}/.yy_rustdesk_env/vcpkg
            ${{ runner.home }}/.yy_rustdesk_env/vcpkg_installed
          # v4: 加入 workflow 文件 hash —— Rust 版本固定 1.96.0 需失效旧缓存（旧缓存用错误 Rust 编译）
          key: vcpkg-android-${{ hashFiles('vcpkg.json', '.github/workflows/build-apk.yml') }}-v4
          # restore-keys 必须带 v4：旧缓存是 ffmpeg 8.1.1 + 错误 Rust 版本（不兼容 hwcodec），
          # 前缀回退会命中旧缓存导致再次失败
          restore-keys: |
            vcpkg-android-v4-

      - name: Ensure key.properties
        run: |
          if [ ! -f flutter/android/key.properties ]; then
            cat > flutter/android/key.properties << 'PROPS'
          storePassword=yy123456
          keyPassword=yy123456
          keyAlias=yy_control
          storeFile=../yy_control.jks
          PROPS
            echo "key.properties 已创建"
          fi
          echo "keystore:"
          ls -la flutter/android/yy_control.jks

      - name: Setup Rust Android targets
        run: |
          # 必须固定 Rust 1.96.0 与本地编译环境一致！
          # 历史教训：b0bfab8 误删 rustup default 后，CI 用 Actions 默认新版 Rust，
          # 同一源码编译出的 .text 代码段不同（实测差 65KB）→ 运行时行为差异
          # → 客户端 first_frame 解码失败降级 VP8（本地 1.96.0 正常、CI 版降级）。
          rustup install 1.96.0 --no-self-update 2>/dev/null || true
          rustup default 1.96.0
          echo "Fixed Rust: $(rustc --version)"
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Setup + Build APK
        run: |
          set -e -o pipefail
          exec 5>&1  # 保存原始 stdout
          exec > >(tee /tmp/build-output.log) 2>&1

          # 强制 ANDROID_NDK_ROOT 与 ANDROID_NDK_HOME 一致（避免 cargo-ndk 用错 NDK 版本）
          export BUILD_ENV_DIR="$HOME/.yy_rustdesk_env"
          mkdir -p "$BUILD_ENV_DIR"
          export NDK_DIR="$BUILD_ENV_DIR/android-ndk-r23b"
          export ANDROID_NDK_HOME="$NDK_DIR"
          export ANDROID_NDK_ROOT="$NDK_DIR"

          # NDK 缓存完整性校验：解压中断会留下残缺目录，若被缓存下来会毒化之后所有构建。
          # source.properties 是官方包根目录标志文件，缺它说明解压没完成。
          if [ -d "$NDK_DIR" ] && [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "NDK 目录残缺（缺 source.properties），删除重下"
            rm -rf "$NDK_DIR"
          fi
          if [ ! -d "$NDK_DIR" ]; then
            echo "=== 下载 NDK r23b ==="
            NDK_ZIP="/tmp/ndk-r23b.zip"
            NDK_URL="https://dl.google.com/android/repository/android-ndk-r23b-linux.zip"
            # run #125/#126 是同一类失败：curl: (92) HTTP/2 stream not closed cleanly，
            # 进度条卡在 1.6% / 24.8% 后上游重置连接。与代码无关，是下载链路抖动。
            # 三条处置：强制 HTTP/1.1（绕开 h2 流被重置）、-C - 断点续传（保住已下字节）、
            # 外层重试 5 次（每次重试接着已下部分继续，不从头来）。
            for i in 1 2 3 4 5; do
              echo "--- NDK 下载尝试 $i/5（已下 $(du -h "$NDK_ZIP" 2>/dev/null | cut -f1 || echo 0) ）---"
              if curl -# -L --http1.1 -C - \
                   --connect-timeout 30 \
                   --retry 3 --retry-delay 5 --retry-all-errors \
                   -o "$NDK_ZIP" "$NDK_URL"; then
                break
              fi
              echo "下载中断，5 秒后从断点续传"
              sleep 5
            done
            # 半截 zip 解压只会得到残缺 NDK（缺文件却看似成功），必须先校验再解压
            if ! unzip -tq "$NDK_ZIP" > /dev/null 2>&1; then
              echo "NDK zip 校验失败，下载不完整："
              ls -lh "$NDK_ZIP" 2>/dev/null || echo "  zip 文件不存在"
              exit 1
            fi
            unzip -q "$NDK_ZIP" -d "$BUILD_ENV_DIR"
            rm -f "$NDK_ZIP"
            echo "NDK 就绪"
          fi

          export VCPKG_DIR="$BUILD_ENV_DIR/vcpkg"
          if [ ! -x "$VCPKG_DIR/vcpkg" ]; then
            echo "=== 下载 vcpkg ==="
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
            "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi

          export VCPKG_INSTALLED_DIR="$BUILD_ENV_DIR/vcpkg_installed"
          export VCPKG_ROOT="$VCPKG_DIR"

          # 装 arm64-android 依赖（--classic 逐个指定，避免复杂包失败拖累全局）
          # ffmpeg 必须装 + 锁定版本：hwcodec build.rs 无条件编译 ffmpeg_ram C++，
          # 其代码兼容 ffmpeg ≤7.1（AVFrame.key_frame 在 8.x 已删除 → 编译失败）。
          # 项目 res/vcpkg/ffmpeg 是 7.1 overlay port，--overlay-ports 强制用 7.1。
          cd "$GITHUB_WORKSPACE"
          if [ ! -d "$VCPKG_INSTALLED_DIR/arm64-android/include/opus" ]; then
            echo "=== 安装 arm64-android 依赖 ==="
            "$VCPKG_DIR/vcpkg" install --classic \
              "opus:arm64-android" \
              "libvpx:arm64-android" \
              "libyuv:arm64-android" \
              "aom:arm64-android" \
              "oboe:arm64-android" \
              "cpu-features:arm64-android" \
              "ffmpeg:arm64-android" \
              --overlay-ports="$GITHUB_WORKSPACE/res/vcpkg" \
              --x-install-root="$VCPKG_INSTALLED_DIR"
          fi
          if [ ! -d "$VCPKG_INSTALLED_DIR/arm-neon-android/include/opus" ]; then
            echo "=== 安装 arm-neon-android 依赖 ==="
            "$VCPKG_DIR/vcpkg" install --classic \
              "opus:arm-neon-android" \
              "libvpx:arm-neon-android" \
              "libyuv:arm-neon-android" \
              "aom:arm-neon-android" \
              "oboe:arm-neon-android" \
              "cpu-features:arm-neon-android" \
              "ffmpeg:arm-neon-android" \
              --overlay-ports="$GITHUB_WORKSPACE/res/vcpkg" \
              --x-install-root="$VCPKG_INSTALLED_DIR"
          fi

          # 验证
          echo "=== arm64 headers ==="
          find "$VCPKG_INSTALLED_DIR/arm64-android/include" -name "*.h" 2>/dev/null | wc -l
          echo "=== arm64 libs ==="
          ls "$VCPKG_INSTALLED_DIR/arm64-android/lib/" 2>/dev/null | wc -l
          
          # 用空桩替换 oboe 库（避免与 oboe-sys crate 编译的版本重复符号）
          for triplet in arm64-android arm-neon-android; do
            OBOE_DIR="$VCPKG_INSTALLED_DIR/$triplet/lib"
            if [ -f "$OBOE_DIR/liboboe.a" ]; then
              echo "替换 $triplet/liboboe.a 为空桩"
              rm -f "$OBOE_DIR/liboboe.a" "$OBOE_DIR/liboboe.so"
              # 创建空的目标文件
              echo '' | "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" -c -x c - -o /tmp/oboe_stub.o 2>/dev/null || touch /tmp/oboe_stub.o
              "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" crs "$OBOE_DIR/liboboe.a" /tmp/oboe_stub.o 2>/dev/null || true
              rm -f /tmp/oboe_stub.o
            fi
          done

          # 跑 build_light.sh（标准 light 版，总是构建）
          # 再扫描 flutter/build_light_*.sh（排除 build_light.sh / *local.sh），
          # 每个脚本是一个版本（参数硬编码在私有源码仓库），依次执行。
          # 每个脚本构建完立即复制产物，避免被后续脚本覆盖。
          mkdir -p "$GITHUB_WORKSPACE/dist"
          VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
          APK_OUT="$GITHUB_WORKSPACE/flutter/build/app/outputs/flutter-apk/app-yy-light-release.apk"

          copy_apk() {
            local NAME="$1"
            if [ -f "$APK_OUT" ]; then
              cp "$APK_OUT" "$GITHUB_WORKSPACE/dist/$NAME"
              echo "APK: dist/$NAME"
              ls -lh "$GITHUB_WORKSPACE/dist/$NAME"
            else
              echo "ERROR: 构建后未找到 APK ($APK_OUT)"
              exit 1
            fi
          }

          echo "=== 开始 build_light.sh (light 标准版) ==="
          bash flutter/build_light.sh
          copy_apk "yy-desk-android-v${VERSION}.apk"

          # 扫描版本脚本（排除 build_light.sh / *local.sh）
          VERSION_SCRIPTS=""
          for f in flutter/build_light_*.sh; do
            case "$(basename "$f")" in
              build_light.sh|*_local.sh) continue ;;
            esac
            VERSION_SCRIPTS="$VERSION_SCRIPTS $f"
          done
          echo "=== 发现版本脚本:${VERSION_SCRIPTS:- (无)} ==="
          for f in $VERSION_SCRIPTS; do
            SCRIPT_BASE=$(basename "$f" .sh)
            VARIANT="${SCRIPT_BASE#build_light_}"
            echo "=== 开始 $f (variant=$VARIANT) ==="
            bash "$f"
            copy_apk "yy-desk-${VARIANT}-android-v${VERSION}.apk"
          done

          echo "=== dist 产物 ==="
          ls -lh "$GITHUB_WORKSPACE/dist/"
          echo "YY_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload diagnostic (on failure)
        if: failure()
        run: |
          mkdir -p /tmp/diag
          echo "=== Build output (last 150 lines) ===" > /tmp/diag/report.txt
          tail -150 /tmp/build-output.log 2>/dev/null >> /tmp/diag/report.txt
          echo "" >> /tmp/diag/report.txt
          echo "=== Vcpkg arm64-android ===" >> /tmp/diag/report.txt
          find /home/runner/.yy_rustdesk_env/vcpkg_installed/arm64-android/include -type f -name "*.h" 2>/dev/null | sort >> /tmp/diag/report.txt
          ls -la /home/runner/.yy_rustdesk_env/vcpkg_installed/arm64-android/lib/ 2>/dev/null >> /tmp/diag/report.txt

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ github.run_id }}
          path: /tmp/diag/
          retention-days: 3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          echo "=== Release 步骤开始 ==="
          TAG="${{ github.ref_name }}"
          VERSION="${{ env.YY_VERSION }}"
          echo "Tag=$TAG  Version=$VERSION"
          echo "Workspace=$GITHUB_WORKSPACE"
          echo "--- dist ---"
          ls -la "$GITHUB_WORKSPACE/dist/" 2>&1 || echo "(no dist dir)"
          echo "--- APK ---"
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f 2>&1
          # 生成 release notes：列出所有 APK 产物名
          {
            printf 'Android APK v%s\n\n### 包含版本\n' "$VERSION"
            for apk in "$GITHUB_WORKSPACE"/dist/*.apk; do
              [ -f "$apk" ] && echo "- $(basename "$apk")"
            done
            printf '\n### 安装\n下载 APK 后，在 Android 设备上安装即可。\n首次安装需在系统设置中允许「未知来源应用」。\n\n### 架构\n- arm64-v8a (64-bit)\n- armeabi-v7a (32-bit)'
          } > /tmp/release-notes.md
          echo "=== 调用 gh release create ==="
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/dist/"*.apk \
            --title "Android APK v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            --repo "github.com/${{ github.repository }}" 2>&1
          EC=$?
          echo "gh exit code: $EC"
          echo "=== Release 完成 ==="

      # 只有走到这里（编译 + 打包 + 发布全部通过才算成功）才把源码版本 +1。
      # 编译失败时本步骤不执行，远端版本号保持不变，下一轮重出同一个号。
      - name: Bump patch version (on success)
        if: success()
        run: |
          git config user.email "jing@yyvendor.com"
          git config user.name "jing"
          # 编译过程会改 Cargo.lock 等文件，先把工作区清干净，只提交 Cargo.toml 的版本行
          git checkout -- . 2>/dev/null || true
          for RETRY in 1 2 3; do
            if [ "$RETRY" -gt 1 ]; then
              echo "重试 $RETRY: 更新本地分支..."
              git fetch origin "${{ secrets.SOURCE_BRANCH }}" || true
              git reset --hard "origin/${{ secrets.SOURCE_BRANCH }}" || true
            fi
            VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml)
            if [ -z "$VERSION" ]; then
              echo "ERROR: 读不到 Cargo.toml 版本号"
              exit 1
            fi
            echo "当前版本: $VERSION (尝试 $RETRY)"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "下一轮版本: $NEW_VERSION"
            sed -i "s/^version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml
            grep '^version' Cargo.toml
            git add Cargo.toml
            git commit -m "chore: bump version to $NEW_VERSION" || true
            if git push origin HEAD:${{ secrets.SOURCE_BRANCH }}; then
              echo "推送成功，下一轮将产出 v$NEW_VERSION"
              exit 0
            fi
            echo "推送失败，2秒后重试..."
            git reset --hard HEAD~1 2>/dev/null || true
            sleep 2
          done
          echo "ERROR: 版本号推送失败 3 次（本轮 APK 已发布，需手工 bump）"
          exit 1
