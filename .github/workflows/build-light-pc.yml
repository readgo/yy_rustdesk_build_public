name: Build PC light (yyDesk 被控端)

on:
  push:
    tags:
      - 'release-light-*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 0: bump PC light 独立版本（pc_light_version 文件）
  # 与 PC control（pc_version）和 APK（Cargo.toml）完全独立。
  # ============================================================
  bump-version:
    name: Bump PC light version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done
      - name: Bump pc_light_version
        id: bump
        run: |
          VERSION=$(cat pc_light_version | tr -d ' \n')
          echo "当前 PC light 版本: $VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "新 PC light 版本: $NEW_VERSION"
          echo "$NEW_VERSION" > pc_light_version
          git config user.email "jing@yyvendor.com"
          git config user.name "jing"
          git add pc_light_version
          git commit -m "chore: bump pc light version to $NEW_VERSION"
          git push origin HEAD:${{ secrets.SOURCE_BRANCH }}
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Job 1: 生成构建矩阵
  # 标准版 yy_light 总是构建。扫描 build_light_pc_*.sh。
  # ============================================================
  setup-matrix:
    name: Generate light build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done
      - id: gen
        run: |
          MATRIX='[{"variant":"yy_light","app_name":"yy_light","server_url":"${{ secrets.YY_SERVER_URL }}","key":"${{ secrets.YY_KEY }}"}]'
          VERSION_SCRIPTS=""
          for f in build_light_pc_*.sh; do
            case "$(basename "$f")" in
              build_light_pc_flutter.sh) continue ;;
            esac
            VERSION_SCRIPTS="$VERSION_SCRIPTS $f"
          done
          echo "=== 发现版本脚本:${VERSION_SCRIPTS:- (无)} ==="
          EXTRA='[]'
          for f in $VERSION_SCRIPTS; do
            SCRIPT_BASE=$(basename "$f" .sh)
            VARIANT="${SCRIPT_BASE#build_light_pc_}"
            unset YY_SERVER_URL YY_KEY YY_APP_NAME
            . "./$f"
            SERVER="${YY_SERVER_URL:-}"
            KEY="${YY_KEY:-}"
            APP_NAME="${YY_APP_NAME:-$VARIANT}"
            if [ -z "$SERVER" ] || [ -z "$KEY" ]; then
              echo "WARNING: $f 缺少 YY_SERVER_URL 或 YY_KEY，跳过"
              continue
            fi
            EXTRA=$(echo "$EXTRA" | python3 -c "import json,sys; extra=json.load(sys.stdin); extra.append({'variant':'$VARIANT','app_name':'$APP_NAME','server_url':'$SERVER','key':'$KEY'}); print(json.dumps(extra))")
          done
          MATRIX=$(echo "$MATRIX" | python3 -c "import json,sys; m=json.load(sys.stdin); m.extend(json.loads('''$EXTRA''')); print(json.dumps(m))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "生成矩阵: $MATRIX"

  # ============================================================
  # Linux — 构建 PC light 版（绿色版目录打包 zip）
  # ============================================================
  build-linux:
    name: Linux PC light (${{ matrix.variant }})
    needs: [setup-matrix, bump-version]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libxdo-dev libva-dev libxcb-randr0-dev \
            libpulse-dev libgstreamer-plugins-base1.0-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev \
            libpam0g-dev libsodium-dev nasm \
            curl wget file imagemagick \
            gcc-12 g++-12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '120deac3062162151622ca4860575a33844ba10b'
          doNotCache: false

      - name: Install vcpkg deps (Linux)
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"
          echo "--- vcpkg installed tree ---"
          ls -la "$VCPKG_ROOT/installed/x64-linux/include/opus" || \
            (echo "ERROR: opus headers missing"; \
             find "$VCPKG_ROOT/installed" -name "opus_multistream.h" 2>/dev/null; \
             exit 1)

      - name: Setup Rust (1.75 MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75.0'
          targets: x86_64-unknown-linux-gnu

      - name: Fetch dependencies (for magnum-opus patching)
        run: cargo fetch

      - name: Fix magnum-opus build.rs (opus header path include both flat and subdir)
        run: python3 scripts/fix-magnum-opus.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Rust CDYLIB
        run: |
          cargo build --lib --release \
            --features flutter,unix-file-copy-paste
        env:
          YY_SERVER_URL: ${{ matrix.server_url }}
          YY_KEY: ${{ matrix.key }}
          YY_APP_NAME: ${{ matrix.app_name }}

      - name: Build Flutter Linux
        run: |
          cd flutter
          flutter build linux --release --dart-define=YY_MODE=light
        env:
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/12

      - name: Package light bundle (zip)
        run: |
          BUNDLE="flutter/build/linux/x64/release/bundle"
          OUTPUT="dist/${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-linux-x86_64"
          mkdir -p "$OUTPUT"
          cp -r "$BUNDLE"/* "$OUTPUT/"
          mv "$OUTPUT/rustdesk" "$OUTPUT/yy_light" 2>/dev/null || true
          cd dist
          zip -r "${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-linux-x86_64.zip" \
            "$(basename "$OUTPUT")"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-linux-x86_64
          path: dist/${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-linux-x86_64.zip

  # ============================================================
  # Job: 发布 GitHub Release
  # ============================================================
  release:
    name: Create PC Light Release
    needs: [bump-version, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          echo "=== Release 步骤开始 ==="
          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.bump-version.outputs.version }}"
          echo "Tag=$TAG  Version=$VERSION"
          echo "--- dist ---"
          ls -la "$GITHUB_WORKSPACE/dist/" 2>&1 || echo "(no dist dir)"
          {
            printf 'yy_light v%s\n\n### 包含版本\n' "$VERSION"
            for f in "$GITHUB_WORKSPACE"/dist/*; do
              [ -f "$f" ] && echo "- $(basename "$f")"
            done
            printf '\n### 平台\n- Linux x86_64 (绿色版 zip)'
          } > /tmp/release-notes.md
          echo "=== 调用 gh release create ==="
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE"/dist/* \
            --title "yy_light v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            --repo "github.com/${{ github.repository }}" 2>&1
          EC=$?
          echo "gh exit code: $EC"
          echo "=== Release 完成 ==="
