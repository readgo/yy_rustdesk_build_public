name: Build PC light (yyDesk 被控端)

on:
  push:
    tags:
      - 'release-light-*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 0: bump PC light 独立版本（pc_light_version 文件）
  # 与 PC control（pc_version）和 APK（Cargo.toml）完全独立。
  # ============================================================
  bump-version:
    name: Bump PC light version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done
      - name: Bump pc_light_version
        id: bump
        run: |
          git config user.email "jing@yyvendor.com"
          git config user.name "jing"
          for RETRY in 1 2 3; do
            if [ "$RETRY" -gt 1 ]; then
              echo "重试 $RETRY: 更新本地分支..."
              git fetch origin "${{ secrets.SOURCE_BRANCH }}" || true
              git reset --hard "origin/${{ secrets.SOURCE_BRANCH }}" || true
            fi
            VERSION=$(cat pc_light_version 2>/dev/null || echo "1.0.0" | tr -d ' \n')
            if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
            echo "当前 PC light 版本: $VERSION (尝试 $RETRY)"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "新 PC light 版本: $NEW_VERSION"
            echo "$NEW_VERSION" > pc_light_version
            git add pc_light_version
            git commit -m "chore: bump pc light version to $NEW_VERSION" || true
            if git push origin HEAD:${{ secrets.SOURCE_BRANCH }}; then
              echo "推送成功"
              echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "推送失败，2秒后重试..."
            sleep 2
          done
          echo "ERROR: 推送失败 3 次"
          exit 1

  # ============================================================
  # Job 1: 生成构建矩阵
  # 标准版 yy_light 总是构建。扫描 build_light_pc_*.sh。
  # 排除 build_light_pc_flutter.sh（基脚本）和 *local.sh（开发者本地测试用，不发布）。
  # artifact 字段 = 产物命名前缀（app_name 的 _ 归一成 -），
  # 统一命名规则：<artifact>-<平台>-<架构>-v<版本>.<扩展名>
  # ============================================================
  setup-matrix:
    name: Generate light build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done
      - id: gen
        run: |
          MATRIX='[{"variant":"yy_light","app_name":"yy_light","artifact":"yy-light","server_url":"${{ secrets.YY_SERVER_URL }}","key":"${{ secrets.YY_KEY }}","script":"build_light_pc_flutter.sh"}]'
          VERSION_SCRIPTS=""
          for f in build_light_pc_*.sh; do
            case "$(basename "$f")" in
              build_light_pc_flutter.sh|*_local.sh) continue ;;
            esac
            VERSION_SCRIPTS="$VERSION_SCRIPTS $f"
          done
          echo "=== 发现版本脚本:${VERSION_SCRIPTS:- (无)} ==="
          EXTRA='[]'
          for f in $VERSION_SCRIPTS; do
            SCRIPT_BASE=$(basename "$f" .sh)
            VARIANT="${SCRIPT_BASE#build_light_pc_}"
            unset YY_SERVER_URL YY_KEY YY_APP_NAME
            . "./$f"
            SERVER="${YY_SERVER_URL:-}"
            KEY="${YY_KEY:-}"
            APP_NAME="${YY_APP_NAME:-$VARIANT}"
            if [ -z "$SERVER" ] || [ -z "$KEY" ]; then
              echo "WARNING: $f 缺少 YY_SERVER_URL 或 YY_KEY，跳过"
              continue
            fi
            ARTIFACT=$(echo "$APP_NAME" | tr '_' '-')
            EXTRA=$(echo "$EXTRA" | python3 -c "import json,sys; extra=json.load(sys.stdin); extra.append({'variant':'$VARIANT','app_name':'$APP_NAME','artifact':'$ARTIFACT','server_url':'$SERVER','key':'$KEY','script':'$f'}); print(json.dumps(extra))")
          done
          MATRIX=$(echo "$MATRIX" | python3 -c "import json,sys; m=json.load(sys.stdin); m.extend(json.loads('''$EXTRA''')); print(json.dumps(m))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "生成矩阵: $MATRIX"

  # ============================================================
  # Linux — AppImage（下载即可用，无需解压）
  # 依赖 apt 系统包 + pkg-config (不依赖 vcpkg ffmpeg，light 不编译 hwcodec)
  # ============================================================
  build-linux:
    name: Linux PC light AppImage (${{ matrix.variant }})
    needs: [setup-matrix, bump-version]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done

      - name: Build (build_light_pc_flutter.sh 自包含环境)
        run: |
          # 完全复用本机构建脚本：自动检测并安装所有依赖
          # (系统包 sudo apt / Rust rustup / vcpkg+依赖 / Flutter SDK)
          bash build_light_pc_flutter.sh
        env:
          YY_SERVER_URL: ${{ matrix.server_url }}
          YY_KEY: ${{ matrix.key }}
          YY_APP_NAME: ${{ matrix.app_name }}
          # MQTT / terminal-url / secret-key 不传：脚本默认值与 APK 正式版一致
          # (remote.yyvendor.com / wtt / https://remote.yyvendor.com/api/v1/device/)
          # 显式传空会覆盖脚本默认值，导致产物无上报配置
          YY_OUTPUT_NAME: ${{ matrix.artifact }}
          PC_LIGHT_VERSION: ${{ needs.bump-version.outputs.version }}
          SKIP_SYSTEM_DEPS: ''

      - name: Download appimagetool
        run: |
          curl -sL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Package AppImage
        run: |
          APPDIR=$(mktemp -d)
          BUNDLE="dist/${{ matrix.artifact }}-flutter-linux-x86_64"
          mkdir -p "$APPDIR/usr/lib/yy_light"
          cp -r "$BUNDLE"/* "$APPDIR/usr/lib/yy_light/"

          # 注意：不打包系统库 (GTK/pango/glib 等)！
          # 依赖宿主系统已装的 GTK3 库（与本地绿色版一致，绿色版已验证跨发行版可跑）。
          # 打包 22.04 的系统库会导致与宿主 glib 版本不匹配崩溃
          # (libpango undefined symbol: g_once_init_leave_pointer)

          cat > "$APPDIR/AppRun" << 'EOSCRIPT'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib/yy_light/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/lib/yy_light/yy_light" "$@"
          EOSCRIPT
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/yy_light.desktop" << 'EODESK'
          [Desktop Entry]
          Name=yy_light
          Comment=Remote Desktop
          Exec=yy_light
          Icon=yy_light
          Type=Application
          Categories=Network;
          Terminal=false
          EODESK
          convert -size 256x256 xc:transparent -fill "#4A90D9" \
            -draw "circle 128,128 128,20" "$APPDIR/yy_light.png" || true

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool \
            "$APPDIR" "dist/${{ matrix.artifact }}-linux-x86_64-v${{ needs.bump-version.outputs.version }}.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-linux-x86_64
          path: dist/${{ matrix.artifact }}-linux-x86_64-v${{ needs.bump-version.outputs.version }}.AppImage

  # ============================================================
  # Windows — 绿色版目录打包 zip
  # 参数与 Linux 完全对齐（MQTT/TERMINAL/SECRET 用脚本默认值 = APK 正式参数）
  # ============================================================
  build-windows:
    name: Windows PC light zip (${{ matrix.variant }})
    needs: [setup-matrix, bump-version]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Clone source
        run: |
          $retries = 3
          for ($i = 1; $i -le $retries; $i++) {
            Write-Host "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules `
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" .
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $retries) {
              Write-Host "克隆失败，等待 10 秒后重试..."
              Start-Sleep -Seconds 10
            } else {
              Write-Host "ERROR: 克隆失败 $retries 次"
              exit 1
            }
          }
        shell: pwsh

      - name: Install LLVM (for bindgen)
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            choco install llvm -y --no-progress
          } else {
            Write-Host "LLVM already installed"
          }
        shell: pwsh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Fetch dependencies (for magnum-opus patching)
        run: cargo fetch

      - name: Fix magnum-opus build.rs (opus header path include both flat and subdir)
        run: python3 scripts/fix-magnum-opus.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Setup vcpkg (manual clone + bootstrap, 不用 lukka action)
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) {
            $env:VCPKG_ROOT = "D:\vcpkg"
          }
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            if (-not (Test-Path "$env:VCPKG_ROOT")) {
              New-Item -ItemType Directory -Force -Path "$env:VCPKG_ROOT" | Out-Null
              # 完整 clone：vcpkg install 需要 baseline 及其引用的 ports 历史 commit
              # （shallow + 单 baseline fetch 仍会 unpack tree object 失败）
              git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            }
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          Write-Host "vcpkg ready: $env:VCPKG_ROOT"

      - name: Install NASM 2.16 (aom 需要 -Ox, vcpkg 自带 3.01 不支持)
        shell: pwsh
        run: |
          # aom 的 test_nasm 检查 nasm -hf 含 "-Ox"；vcpkg 下载的 nasm 3.01
          # 输出格式不含 -Ox → 用 2.16（与 Linux 一致）。放 PATH 前，让
          # vcpkg_find_acquire_program(NASM) 找到它。
          $nasmDir = "D:\nasm-2.16"
          if (-not (Test-Path "$nasmDir\nasm.exe")) {
            New-Item -ItemType Directory -Force -Path $nasmDir | Out-Null
            curl.exe -sL -o "$nasmDir\nasm.zip" "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"
            Expand-Archive -Path "$nasmDir\nasm.zip" -DestinationPath $nasmDir -Force
            Get-ChildItem "$nasmDir" -Recurse -Filter "nasm.exe" | ForEach-Object {
              Copy-Item $_.FullName "$nasmDir\nasm.exe" -Force
            }
          }
          Write-Host "PATH 前插入 nasm: $nasmDir"
          echo "$nasmDir" >> $env:GITHUB_PATH

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          # 完整安装（与 Linux 脚本对齐：opus/vpx 等全部依赖）
          & "$env:VCPKG_ROOT\vcpkg" install --triplet x64-windows-static --keep-going `
            --x-install-root="$env:VCPKG_ROOT\installed" 2>&1
          $installExit = $LASTEXITCODE
          if ($installExit -ne 0) {
            Write-Host "=== vcpkg install 失败，输出 aom 错误日志 ==="
            Get-ChildItem "$env:VCPKG_ROOT\buildtrees\aom" -Filter "*.log" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name) ---"
              Get-Content $_.FullName -Tail 30 -ErrorAction SilentlyContinue
            }
            exit $installExit
          }
          $opusInc = "$env:VCPKG_ROOT\installed\x64-windows-static\include\opus"
          if (-not (Test-Path "$opusInc\opus_multistream.h")) {
            Write-Error "ERROR: opus headers missing at $opusInc"
            exit 1
          }
          Write-Host "OK: opus found"

      - name: Set Rust env vars for vcpkg
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $env:GITHUB_ENV

      - name: Build Rust CDYLIB
        shell: pwsh
        run: |
          $env:YY_SERVER_URL = "${{ matrix.server_url }}"
          $env:YY_KEY = "${{ matrix.key }}"
          $env:YY_APP_NAME = "${{ matrix.app_name }}"
          # 从对应版本的 Linux 脚本读取默认值（单一配置源，与 Linux 一致，
          # 不在此硬编码任何秘密；matrix.script 指定版本脚本）
          # 基脚本 (build_light_pc_flutter.sh) 用 ${VAR:-default} 模式；
          # 版本脚本 (build_light_pc_*.sh) 用 export VAR="value" 直接覆盖。
          # 读取顺序: 版本脚本覆盖值 > 基脚本默认值
          $scriptFile = "${{ matrix.script }}"
          if (-not $scriptFile) { $scriptFile = "build_light_pc_flutter.sh" }
          $cfgVars = @("YY_MQTT_HOST","YY_MQTT_PORT","YY_MQTT_USER","YY_MQTT_PASS","YY_TERMINAL_URL","YY_SECRET_KEY")
          $values = @{}
          # 1. 基脚本默认值 (${VAR:-default})
          $baseScript = Get-Content "build_light_pc_flutter.sh" -Raw
          foreach ($var in $cfgVars) {
            $m = [regex]::Match($baseScript, [regex]::Escape($var) + '="\$\{' + [regex]::Escape($var) + ':-([^}]*)\}"')
            if ($m.Success) { $values[$var] = $m.Groups[1].Value }
          }
          # 2. 版本脚本覆盖 (export VAR="value" 或 ${VAR:-default})
          if ($scriptFile -ne "build_light_pc_flutter.sh" -and (Test-Path $scriptFile)) {
            $verScript = Get-Content $scriptFile -Raw
            foreach ($var in $cfgVars) {
              $m1 = [regex]::Match($verScript, 'export ' + [regex]::Escape($var) + '="([^"]*)"')
              $m2 = [regex]::Match($verScript, [regex]::Escape($var) + '="\$\{' + [regex]::Escape($var) + ':-([^}]*)\}"')
              if ($m1.Success) { $values[$var] = $m1.Groups[1].Value }
              elseif ($m2.Success) { $values[$var] = $m2.Groups[1].Value }
            }
          }
          foreach ($var in $cfgVars) {
            if ($values.ContainsKey($var)) {
              Set-Item -Path "env:$var" -Value $values[$var]
              Write-Host "从脚本读取 $var"
            } else {
              Write-Error "脚本中未找到 $var 默认值，请检查 build_light_pc_flutter.sh"
              exit 1
            }
          }
          $env:PC_LIGHT_VERSION = "${{ needs.bump-version.outputs.version }}"
          # unix-file-copy-paste 是 unix-only，Windows 不启用（否则会把 FILE_NAME/unix_file_clip 等 unix 代码带到 Windows 导致编译失败）
          cargo build --lib --release --features flutter,yy_light

      - name: Build Flutter Windows
        shell: pwsh
        run: |
          cd flutter
          flutter build windows --release `
            --dart-define=YY_MODE=light

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $BUNDLE = "flutter\build\windows\x64\runner\Release"
          $NAME = "${{ matrix.artifact }}"
          $VERSION = "${{ needs.bump-version.outputs.version }}"
          $OUTPUT = "dist\$NAME-windows-x86_64-v$VERSION"
          New-Item -ItemType Directory -Force -Path $OUTPUT
          Copy-Item "$BUNDLE\*" "$OUTPUT\" -Recurse -Force
          Compress-Archive -Path "$OUTPUT\*" -DestinationPath "dist\$NAME-windows-x86_64-v$VERSION.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-windows-x86_64
          path: dist/${{ matrix.artifact }}-windows-x86_64-v${{ needs.bump-version.outputs.version }}.zip

  # ============================================================
  # Job: 发布 GitHub Release
  # ============================================================
  release:
    name: Create PC Light Release
    needs: [bump-version, build-windows, build-linux]  # Linux 已恢复
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          echo "=== Release 步骤开始 ==="
          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.bump-version.outputs.version }}"
          echo "Tag=$TAG  Version=$VERSION"
          echo "--- dist ---"
          ls -la "$GITHUB_WORKSPACE/dist/" 2>&1 || echo "(no dist dir)"
          {
            printf 'yy_light v%s\n\n### 包含版本\n' "$VERSION"
            for f in "$GITHUB_WORKSPACE"/dist/*; do
              [ -f "$f" ] && echo "- $(basename "$f")"
            done
            printf '\n### 平台\n- Linux x86_64 (AppImage，下载后 chmod +x 直接运行)'
          } > /tmp/release-notes.md
          echo "=== 调用 gh release create ==="
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE"/dist/* \
            --title "yy_light v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            --repo "github.com/${{ github.repository }}" 2>&1
          EC=$?
          echo "gh exit code: $EC"
          echo "=== Release 完成 ==="
