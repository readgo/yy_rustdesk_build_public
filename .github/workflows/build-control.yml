name: Build yy_control (Linux AppImage + Windows exe)

on:
  push:
    tags:
      - 'release-*'
      - 'test-*'
      - 'release-linux-*'
      - 'test-linux-*'
      - 'release-win-*'
      - 'test-win-*'
    tags-ignore:
      - 'release-light-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (for artifact naming)'
        required: false
        default: 'manual'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ============================================================
  # Job 0: bump PC 控制端独立版本（pc_version 文件）
  # 与 APK 的 Cargo.toml 版本完全独立，互不影响。
  # 每次构建 patch+1（1.0.0 → 1.0.1 → ...），push 回源码仓库。
  # ============================================================
  bump-version:
    name: Bump PC version
    if: ${{ !startsWith(github.ref_name, 'release-apk-') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done
      - name: Bump pc_version
        id: bump
        run: |
          git config user.email "jing@yyvendor.com"
          git config user.name "jing"
          for RETRY in 1 2 3; do
            # need fresh pc_version on retry
            if [ "$RETRY" -gt 1 ]; then
              echo "重试 $RETRY: 更新本地分支..."
              git fetch origin "${{ secrets.SOURCE_BRANCH }}" || true
              git reset --hard "origin/${{ secrets.SOURCE_BRANCH }}" || true
            fi
            VERSION=$(cat pc_version | tr -d ' \n')
            echo "当前 PC 版本: $VERSION (尝试 $RETRY)"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "新 PC 版本: $NEW_VERSION"
            echo "$NEW_VERSION" > pc_version
            git add pc_version
            git commit -m "chore: bump pc control version to $NEW_VERSION" || true
            if git push origin HEAD:${{ secrets.SOURCE_BRANCH }}; then
              echo "推送成功"
              echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "推送失败，2秒后重试..."
            sleep 2
          done
          echo "ERROR: 推送失败 3 次"
          exit 1

  # ============================================================
  # Job 1: 生成构建矩阵
  # 标准版 yy_control 总是构建（用 secrets.YY_SERVER_URL/YY_KEY）。
  # 扫描私有源码仓库 build_control_*.sh（排除 build_control_flutter.sh），
  # source 读取每个脚本 export 的 YY_SERVER_URL/YY_KEY → 追加到矩阵。
  # 与本地 build_control_<版本>.sh 参数一致，CI 只读参数不执行脚本。
  # 新增版本 = 私有仓库加脚本，不改 CI 代码。
  # ============================================================
  setup-matrix:
    name: Generate control build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done
      - id: gen
        run: |
          # 标准版 yy_control 总是构建，服务器/key 用 secrets
          MATRIX='[{"variant":"yy_control","app_name":"yy_control","server_url":"${{ secrets.YY_SERVER_URL }}","key":"${{ secrets.YY_KEY }}"}]'
          # 扫描版本脚本（排除 build_control_flutter.sh 构建模板）
          VERSION_SCRIPTS=""
          for f in build_control_*.sh; do
            case "$(basename "$f")" in
              build_control_flutter.sh) continue ;;
            esac
            VERSION_SCRIPTS="$VERSION_SCRIPTS $f"
          done
          echo "=== 发现版本脚本:${VERSION_SCRIPTS:- (无)} ==="
          EXTRA='[]'
          for f in $VERSION_SCRIPTS; do
            SCRIPT_BASE=$(basename "$f" .sh)
            VARIANT="${SCRIPT_BASE#build_control_}"
            # 清空上次残留，再 source 脚本读取其 export 的 YY_SERVER_URL / YY_KEY / YY_APP_NAME
            unset YY_SERVER_URL YY_KEY YY_APP_NAME
            . "./$f"
            SERVER="${YY_SERVER_URL:-}"
            KEY="${YY_KEY:-}"
            APP_NAME="${YY_APP_NAME:-$VARIANT}"
            if [ -z "$SERVER" ] || [ -z "$KEY" ]; then
              echo "WARNING: $f 缺少 YY_SERVER_URL 或 YY_KEY，跳过"
              continue
            fi
            EXTRA=$(echo "$EXTRA" | python3 -c "import json,sys; extra=json.load(sys.stdin); extra.append({'variant':'$VARIANT','app_name':'$APP_NAME','server_url':'$SERVER','key':'$KEY'}); print(json.dumps(extra))")
          done
          # 合并标准版 + 版本
          MATRIX=$(echo "$MATRIX" | python3 -c "import json,sys; m=json.load(sys.stdin); m.extend(json.loads('''$EXTRA''')); print(json.dumps(m))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "生成矩阵: $MATRIX"

  # ============================================================
  # Linux — AppImage
  # 依赖 apt 系统包 + pkg-config (不依赖 vcpkg)
  # 矩阵：标准版 yy_control + 各版本脚本，产物按变体命名
  # ============================================================
  build-linux:
    name: Linux AppImage (${{ matrix.variant }})
    if: ${{ !startsWith(github.ref_name, 'release-win-') && !startsWith(github.ref_name, 'test-win-') && !startsWith(github.ref_name, 'release-apk-') && !startsWith(github.ref_name, 'test-apk-') }}
    needs: [setup-matrix, bump-version]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Clone source
        run: |
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules \
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" . && break
            if [ $i -lt $RETRIES ]; then
              echo "克隆失败，等待 10 秒后重试..."
              sleep 10
            else
              echo "ERROR: 克隆失败 $RETRIES 次"
              exit 1
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libxdo-dev libva-dev libxcb-randr0-dev \
            libpulse-dev libgstreamer-plugins-base1.0-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev \
            libpam0g-dev libsodium-dev nasm \
            curl wget file imagemagick \
            gcc-12 g++-12
          # Use GCC 12 for all C compilation to avoid GLIBC_2.39 symbols
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '120deac3062162151622ca4860575a33844ba10b'
          doNotCache: false

      - name: Install vcpkg deps (Linux)
        run: |
          # Manifest mode would install to ./vcpkg_installed/ by default.
          # magnum-opus build.rs expects $VCPKG_ROOT/installed/, so override.
          $VCPKG_ROOT/vcpkg install --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"
          # hwcodec 需要 ffmpeg（用项目 overlay 的 7.1，只装核心不带 nvcodec/amf/qsv）
          $VCPKG_ROOT/vcpkg install "ffmpeg[core]:x64-linux" --classic \
            --overlay-ports="$GITHUB_WORKSPACE/res/vcpkg" \
            --x-install-root="$VCPKG_ROOT/installed" 2>&1 | tail -5
          echo "--- vcpkg installed tree ---"
          ls -la "$VCPKG_ROOT/installed/x64-linux/include/opus" || \
            (echo "ERROR: opus headers missing"; \
             find "$VCPKG_ROOT/installed" -name "opus_multistream.h" 2>/dev/null; \
             exit 1)
          ls "$VCPKG_ROOT/installed/x64-linux/lib/libavcodec"* 2>/dev/null || \
            (echo "ERROR: ffmpeg libavcodec missing"; exit 1)

      - name: Setup Rust (1.75 MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75.0'
          targets: x86_64-unknown-linux-gnu

      - name: Fetch dependencies (for magnum-opus patching)
        run: cargo fetch

      - name: Fix magnum-opus build.rs (opus header path include both flat and subdir)
        run: python3 scripts/fix-magnum-opus.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Rust CDYLIB
        run: |
          cargo build --lib --release \
            --features flutter,yy_control,unix-file-copy-paste,hwcodec
        env:
          YY_SERVER_URL: ${{ matrix.server_url }}
          YY_KEY: ${{ matrix.key }}
          YY_APP_NAME: ${{ matrix.app_name }}

      - name: Verify no GLIBC_2.39 symbols
        run: |
          LIB="target/release/librustdesk.so"
          if objdump -T "$LIB" | grep -q "GLIBC_2\\.39"; then
            echo "ERROR: librustdesk.so still has GLIBC_2.39 symbols!"
            objdump -T "$LIB" | grep "GLIBC_2\\.39"
            exit 1
          fi
          echo "OK: no GLIBC_2.39 symbols"

      - name: Build Flutter Linux
        run: |
          cd flutter
          flutter build linux --release --dart-define=YY_MODE=control
        env:
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/12

      - name: Download appimagetool
        run: |
          curl -sL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Package AppImage
        run: |
          APPDIR=$(mktemp -d)
          BUNDLE="flutter/build/linux/x64/release/bundle"
          mkdir -p "$APPDIR/usr/lib/yy_control"
          cp -r "$BUNDLE"/* "$APPDIR/usr/lib/yy_control/"

          mkdir -p "$APPDIR/usr/lib/x86_64-linux-gnu"
          for lib in \
            libgtk-3.so.0 libgdk-3.so.0 libglib-2.0.so.0 libgobject-2.0.so.0 \
            libgio-2.0.so.0 libcairo.so.2 libcairo-gobject.so.2 libgdk_pixbuf-2.0.so.0 \
            libatk-1.0.so.0 libatk-bridge-2.0.so.0 libatspi.so.0 \
            libepoxy.so.0 libpng16.so.16 libjpeg.so.8 libexpat.so.1 \
            libX11.so.6 libXfixes.so.3 libxcb.so.1 libxcb-shm.so.0 \
            libxcb-randr.so.0 libxcb-xfixes.so.0 libxcb-shape.so.0 \
            libXdamage.so.1 libXcomposite.so.1 libXrender.so.1 \
            libXext.so.6 libXcursor.so.1 libXi.so.6 libXtst.so.6 \
            libXrandr.so.2 libXinerama.so.1 libxkbcommon.so.0 \
            libstdc++.so.6 libm.so.6 libgcc_s.so.1 \
            libpcre2-8.so.0 libffi.so.8 libpixman-1.so.0 \
            libuuid.so.1 libbz2.so.1.0 libEGL.so.1 libGL.so.1 \
            libdrm.so.2 libgbm.so.1 \
            libwayland-client.so.0 libwayland-cursor.so.0 \
            libwayland-egl.so.1 libwayland-server.so.0 \
            libgstreamer-1.0.so.0 libgstvideo-1.0.so.0 libgstbase-1.0.so.0 \
            libgstpbutils-1.0.so.0 libgstaudio-1.0.so.0 libgsttag-1.0.so.0 \
            libgmodule-2.0.so.0 libgstapp-1.0.so.0 libgstriff-1.0.so.0 \
            liborc-0.4.so.0; do
            cp -L "/lib/x86_64-linux-gnu/$lib" "$APPDIR/usr/lib/x86_64-linux-gnu/" 2>/dev/null || true
            cp -L "/usr/lib/x86_64-linux-gnu/$lib" "$APPDIR/usr/lib/x86_64-linux-gnu/" 2>/dev/null || true
          done

          cat > "$APPDIR/AppRun" << 'EOSCRIPT'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib/yy_control/lib:$HERE/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
          exec "$HERE/usr/lib/yy_control/rustdesk" "$@"
          EOSCRIPT
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/yy_control.desktop" << 'EODESK'
          [Desktop Entry]
          Name=YY Control
          Comment=Remote Desktop Client
          Exec=yy_control
          Icon=yy_control
          Type=Application
          Categories=Network;
          Terminal=false
          EODESK
          convert -size 256x256 xc:transparent -fill "#4A90D9" \
            -draw "circle 128,128 128,20" "$APPDIR/yy_control.png" || true

          mkdir -p dist
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool \
            "$APPDIR" "dist/${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-linux-x86_64
          path: dist/${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-x86_64.AppImage

  # ============================================================
  # Windows — exe bundle
  # 依赖 vcpkg 安装原生库
  # 矩阵：标准版 yy_control + 各版本脚本，产物按变体命名
  # ============================================================
  build-windows:
    name: Windows exe (${{ matrix.variant }})
    if: ${{ !startsWith(github.ref_name, 'release-linux-') && !startsWith(github.ref_name, 'test-linux-') && !startsWith(github.ref_name, 'release-apk-') && !startsWith(github.ref_name, 'test-apk-') }}
    needs: [setup-matrix, bump-version]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Clone source
        run: |
          $retries = 3
          for ($i = 1; $i -le $retries; $i++) {
            Write-Host "尝试克隆（第 $i 次）..."
            git clone --branch "${{ secrets.SOURCE_BRANCH }}" --recurse-submodules `
              "https://${{ secrets.SOURCE_USERNAME }}:${{ secrets.SOURCE_TOKEN }}@${{ secrets.SOURCE_GIT_HOST }}/${{ secrets.SOURCE_REPO }}.git" .
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $retries) {
              Write-Host "克隆失败，等待 10 秒后重试..."
              Start-Sleep -Seconds 10
            } else {
              Write-Host "ERROR: 克隆失败 $retries 次"
              exit 1
            }
          }
        shell: pwsh

      - name: Install LLVM (for bindgen)
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang.exe")) {
            choco install llvm -y --no-progress
          } else {
            Write-Host "LLVM already installed"
          }
        shell: pwsh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Fetch dependencies (for magnum-opus patching)
        run: cargo fetch

      - name: Fix magnum-opus build.rs (opus header path include both flat and subdir)
        run: python3 scripts/fix-magnum-opus.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '120deac3062162151622ca4860575a33844ba10b'
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          # Manifest mode would install to .\vcpkg_installed\ by default.
          # magnum-opus build.rs expects $VCPKG_ROOT\installed\, so override.
          & "$env:VCPKG_ROOT\vcpkg" install --triplet x64-windows-static `
            --x-install-root="$env:VCPKG_ROOT\installed"
          # hwcodec 需要 ffmpeg（用项目 overlay 的 7.1，只装核心不带 nvcodec/amf/qsv）
          & "$env:VCPKG_ROOT\vcpkg" install "ffmpeg[core]:x64-windows-static" --classic `
            --overlay-ports="$env:GITHUB_WORKSPACE\res\vcpkg" `
            --x-install-root="$env:VCPKG_ROOT\installed" 2>&1 | Select-Object -Last 5
          $opusInc = "$env:VCPKG_ROOT\installed\x64-windows-static\include\opus"
          if (-not (Test-Path "$opusInc\opus_multistream.h")) {
            Write-Error "ERROR: opus headers missing at $opusInc"
            Get-ChildItem -Recurse -Filter opus_multistream.h `
              "$env:VCPKG_ROOT\installed" -ErrorAction SilentlyContinue
            exit 1
          }
          $avcodec = "$env:VCPKG_ROOT\installed\x64-windows-static\lib\avcodec.lib"
          if (-not (Test-Path $avcodec)) {
            Write-Error "ERROR: ffmpeg avcodec.lib missing"
            exit 1
          }
          Write-Host "OK: opus + ffmpeg found"
        shell: pwsh

      - name: Set Rust env vars for vcpkg
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $env:GITHUB_ENV

      - name: Build Rust CDYLIB
        run: |
          cargo build --lib --release `
            --features flutter,yy_control,hwcodec
        env:
          YY_SERVER_URL: ${{ matrix.server_url }}
          YY_KEY: ${{ matrix.key }}
          YY_APP_NAME: ${{ matrix.app_name }}

      - name: Build Flutter Windows
        run: |
          cd flutter
          flutter build windows --release --dart-define=YY_MODE=control

      - name: Package Windows bundle
        run: |
          $BUNDLE = "flutter\build\windows\x64\runner\Release"
          $OUTPUT = "dist\${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $OUTPUT
          Copy-Item "$BUNDLE\*" "$OUTPUT\" -Recurse -Force
          Compress-Archive -Path "$OUTPUT\*" -DestinationPath "dist\${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-windows-x86_64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-windows-x86_64
          path: dist/${{ matrix.variant }}-${{ needs.bump-version.outputs.version }}-windows-x86_64.zip

  # ============================================================
  # Job: 发布 GitHub Release（合并所有变体产物）
  # 打 release-* 标签时，把 Linux AppImage + Windows zip 发布到
  # 对应 tag 的 GitHub Release。
  # ============================================================
  release:
    name: Create PC Control Release
    if: ${{ startsWith(github.ref_name, 'release-') && !startsWith(github.ref_name, 'release-apk-') }}
    needs: [bump-version, build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          echo "=== Release 步骤开始 ==="
          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.bump-version.outputs.version }}"
          echo "Tag=$TAG  Version=$VERSION"
          echo "--- dist ---"
          ls -la "$GITHUB_WORKSPACE/dist/" 2>&1 || echo "(no dist dir)"
          # 生成 release notes
          {
            printf 'yy_control v%s\n\n### 包含版本\n' "$VERSION"
            for f in "$GITHUB_WORKSPACE"/dist/*; do
              [ -f "$f" ] && echo "- $(basename "$f")"
            done
            printf '\n### 平台\n- Linux x86_64 (AppImage)\n- Windows x86_64 (zip)'
          } > /tmp/release-notes.md
          echo "=== 调用 gh release create ==="
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE"/dist/* \
            --title "yy_control v$VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            --repo "github.com/${{ github.repository }}" 2>&1
          EC=$?
          echo "gh exit code: $EC"
          echo "=== Release 完成 ==="
